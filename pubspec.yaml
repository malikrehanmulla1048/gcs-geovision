name: geovision_campus_security
description: GeoVision Campus Security Command Centre — Flutter App
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  provider: ^6.1.2

  # Persistence (works on all platforms including web)
  shared_preferences: ^2.2.3

  # UI & styling
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

  # HTTP (backend API calls)
  http: ^1.2.1
  http_parser: ^4.0.2

  # WebSocket (camera stream)
  web_socket_channel: ^3.0.1

  # Web APIs (webcam access via dart:js_interop) - web-only, not compiled for Android
  web: ^0.5.1

  # URL launcher (for update downloads)
  url_launcher: ^6.3.0

  # Geolocation for physical geofencing
  geolocator: ^11.0.0
  camera: ^0.12.0+1
  camera_windows: ^0.2.6+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  msix: ^3.16.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

msix_config:
  display_name: GeoVision Campus Security
  publisher_display_name: GeoVision
  publisher: CN=GeoVision, O=GeoVision, C=US
  identity_name: com.geovision.gcs
  version: 1.0.0.0
  logo_path: assets/logo.png
  capabilities: internetClient, webcam
