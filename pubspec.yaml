name: geovision_campus_security
description: GeoVision Campus Security Command Centre — Flutter App
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  provider: ^6.1.2

  # Persistence (works on all platforms including web)
  shared_preferences: ^2.2.3

  # UI & styling
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

  # HTTP (backend API calls)
  http: ^1.2.1
  http_parser: ^4.0.2

  # WebSocket (camera stream)
  web_socket_channel: ^3.0.1

  # Web APIs (webcam access via dart:js_interop)
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
